name: Windows normal renderer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pillow pyrender 'pyglet<2' trimesh
      - run: python tests/windows_render_smoke.py
