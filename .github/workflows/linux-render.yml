name: Linux normal renderer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libglu1-mesa
      - run: python -m pip install numpy pillow pyrender 'pyglet<2' trimesh
      - run: python tests/render_smoke.py
      - run: python -m pip install 'PyOpenGL==3.1.10'
      - run: python tests/render_smoke.py
